*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}

.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:inherit;width:100%}.fld input[type=checkbox]{width:18px;height:18px;margin-top:6px}

#splash .stage{width:96px;height:146px;position:relative;transform-style:preserve-3d;animation:spin 4.5s cubic-bezier(.4,.05,.3,1) 1 both}

/* ===== Liquid glass skin ===== */

 background:radial-gradient(40% 38% at 14% 12%,var(--blob1),transparent 70%),radial-gradient(36% 34% at 86% 18%,var(--blob2),transparent 70%),radial-gradient(42% 40% at 72% 88%,var(--blob3),transparent 70%),radial-gradient(34% 32% at 10% 84%,var(--blob4),transparent 70%);
 animation:drift 48s ease-in-out infinite alternate;will-change:transform}

header{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--rim),var(--shadow)}

.t.od{border-left:3px solid var(--red)}

.dot.r{box-shadow:0 0 8px var(--red)}.dot.a{box-shadow:0 0 8px var(--amber)}.dot.g{box-shadow:0 0 8px var(--ok)}.dot.x{background:var(--mute);opacity:.5}

function askDlg(o){return new Promise(function(res){var d=document.createElement('div');d.className='askov';
  var btns=o.choices?'<div class="askch">'+o.choices.map(function(c,i){return'<button class="b" data-ch="'+i+'">'+esc(c)+'</button>'}).join('')+'</div><div class="askbtns"><button class="b" data-no>Cancel</button></div>'
    :'<div class="askbtns"><button class="b" data-no>'+esc(o.no||'Cancel')+'</button><button class="b '+(o.danger?'dng':'pri')+'" data-yes>'+esc(o.yes||'OK')+'</button></div>';
  d.innerHTML='<div class="askbox" role="dialog" aria-modal="true"><div class="asktt">'+esc(o.title||'')+'</div><div class="askmsg">'+esc(o.msg||'')+'</div>'+(o.input?'<input class="askin" value="'+esc(o.def||'')+'" placeholder="'+esc(o.ph||'')+'" autocomplete="off">':'')+btns+'</div>';
  var prev=document.activeElement,done=false;function fin(v){if(done)return;done=true;document.removeEventListener('keydown',kd,true);d.classList.add('bye');setTimeout(function(){d.remove();try{if(prev&&prev.focus)prev.focus()}catch(e){}},120);res(v)}
  function val(){var i=d.querySelector('.askin');return i?i.value:true}
  function kd(e){if(e.key==='Escape'){e.stopPropagation();e.preventDefault();fin(o.input?null:(o.choices?null:false))}else if(e.key==='Enter'&&!o.choices&&!(e.target&&e.target.closest&&e.target.closest('[data-no]'))){e.stopPropagation();e.preventDefault();fin(val())}else if(e.key==='Tab'){var f=[].slice.call(d.querySelectorAll('input,button'));if(!f.length)return;var i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?f.length-1:1))%f.length].focus()}}
  d.addEventListener('mousedown',function(e){if(e.target===d)fin(o.input?null:(o.choices?null:false))});
  d.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-no'))fin(o.input?null:(o.choices?null:false));else if(b.hasAttribute('data-yes'))fin(val());else if(b.dataset.ch!==undefined)fin(o.choices[+b.dataset.ch])});
  document.body.appendChild(d);document.addEventListener('keydown',kd,true);var f=d.querySelector('.askin')||d.querySelector('[data-yes]')||d.querySelector('[data-ch]');if(f){f.focus();if(f.select)f.select()}})}
function askOk(msg,o){return askDlg(Object.assign({msg:msg,title:'Please confirm'},o||{}))}

function parseDue(s){ // accepts yyyy-MM-dd or "Sat, Nov 14"
  if(!s)return null;if(/^\d{4}-/.test(s))return new Date(s+'T00:00:00');
  var m=s.toLowerCase().match(/([a-z]{3})[a-z]*\s+(\d{1,2})/);if(!m||MON.indexOf(m[1])<0)return null;
  var d=new Date(today().getFullYear(),MON.indexOf(m[1]),+m[2]);if(d<today()-200*864e5)d.setFullYear(d.getFullYear()+1);return d}

  var em=String(d.email||'').toLowerCase(),lastEm='';try{lastEm=localStorage.getItem('ta_who_acct')||''}catch(e){}
  if(em&&lastEm!==em){who=d.me||'';try{localStorage.setItem('ta_who',who);localStorage.setItem('ta_who_acct',em)}catch(e){}}
  if(who&&d.people.indexOf(who)<0){var wl=who.toLowerCase(),hit=d.people.filter(function(p){return p.toLowerCase().split(' ')[0]===wl})[0];who=hit||'';try{localStorage.setItem('ta_who',who)}catch(e){}}

  w.innerHTML='<option value="">Everyone</option>'+d.people.map(function(p){return'<option'+(p===who?' selected':'')+'>'+esc(p)+'</option>'}).join('');
  document.getElementById('forl').innerHTML=d.forOptions.map(function(f){return'<option value="#'+esc(f)+'">'}).join('');
  render();document.getElementById('rf').textContent='↻'}).catch(function(e){toast(e.message);document.getElementById('rf').textContent='↻';
  if(!D)document.getElementById('v').innerHTML='<div class="errcard"><div class="errtt">Couldn\'t load the tracker</div><div class="m">'+esc(/NO_ACCESS/.test(e.message)?'This account does not have access.':(e.message||'Something went wrong.'))+'</div><div class="m">Check your internet connection, then try again.</div><button class="b pri" onclick="load()">Try again</button></div>'})}

function lSpark(sr){if(sr.length<2)return'';var w=110,h=22,vs=sr.map(function(x){return x.v}),mn=Math.min.apply(0,vs),mx=Math.max.apply(0,vs),rg=mx-mn||1;
