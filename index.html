*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}

header{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--rim),var(--shadow)}

  var b=document.createElement('div');b.id='delbar';b.className='delbar';b.dataset.tab=ED.tab;b.dataset.row=ED.row;b.dataset.name=ED.key;
