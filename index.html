*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}

header{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--rim),var(--shadow)}

<script>
/* Brand logos: white versions on the dark theme, black on the light one. m = eye mark, w = INNRVZN wordmark. */
var LG={mw:"logo_mark_white.png",mb:"logo_mark_black.png",ww:"logo_word_white.png",wb:"logo_word_black.png"};
function logoSrc(k){return document.documentElement.getAttribute('data-theme')==='light'?LG[k+'b']:LG[k+'w']}
function paintLogo(){var h=document.getElementById('hlogo');if(h)h.src=logoSrc('m');var s=document.getElementById('spimg');if(s)s.src=logoSrc('m');
  [].forEach.call(document.querySelectorAll('img[data-lg]'),function(i){i.src=logoSrc(i.getAttribute('data-lg'))})}
paintLogo();
var D=null,view='dash',who='';try{who=localStorage.getItem('ta_who')||''}catch(e){}
var DAYS=['sun','mon','tue','wed','thu','fri','sat'],MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function run(fn){var a=[].slice.call(arguments,1);var f=window.__api&&window.__api[fn];if(!f)return Promise.resolve({ok:true});try{return Promise.resolve(f.apply(null,a))}catch(e){return Promise.reject(e)}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2600)}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function parseDue(s){ // accepts yyyy-MM-dd or "Sat, Nov 14"
  if(!s)return null;if(/^\d{4}-/.test(s))return new Date(s+'T00:00:00');
  var m=s.toLowerCase().match(/([a-z]{3})[a-z]*\s+(\d{1,2})/);if(!m||MON.indexOf(m[1])<0)return null;
  var d=new Date(today().getFullYear(),MON.indexOf(m[1]),+m[2]);if(d<today()-200*864e5)d.setFullYear(d.getFullYear()+1);return d}
function fmt(d){return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'No date'}
function load(force){document.getElementById('rf').textContent='…';return run('getData').then(function(d){D=d;classify(D);
  if(!who)who=d.me||'';var w=document.getElementById('who');
  w.innerHTML='<option value="">Everyone</option>'+d.people.map(function(p){return'<option'+(p===who?' selected':'')+'>'+esc(p)+'</option>'}).join('');
  document.getElementById('forl').innerHTML=d.forOptions.map(function(f){return'<option value="#'+esc(f)+'">'}).join('');
  render();document.getElementById('rf').textContent='↻'}).catch(function(e){toast(e.message);document.getElementById('rf').textContent='↻';
  if(!D)document.getElementById('v').innerHTML='<div class="empty">Couldn\'t load the tracker: '+esc(e.message)+'<br><br><button class="b" onclick="load()">Try again</button></div>'})}
function mine(t){return !who||t.owner.toLowerCase().indexOf(who.toLowerCase())>-1}
function sortT(a,b){if(a.bump!==b.bump)return a.bump?1:-1;var x=parseDue(a.due),y=parseDue(b.due);return(x?x:9e15)-(y?y:9e15)}
function taskHtml(t){var d=parseDue(t.due),od=d&&d<today();
  return'<div class="t'+(od?' od':'')+(t.deliv?' dlvt':'')+'">'+(t.deliv?'<button class="dlvb" data-dlv="'+t.row+'" data-n="'+esc(t.task)+'" data-f="'+esc(t.forName)+'" title="Submit the deliverable to complete this task">◆</button>':'<input type="checkbox" data-r="'+t.row+'" data-n="'+esc(t.task)+'" title="Complete">')+'<div class="n"><span class="tn" data-task="'+t.row+'" style="cursor:pointer">'+esc(t.task)+'</span>'+
  '<div class="m">'+(t.deliv?'<span class="dlvtag">Deliverable</span> ':'')+esc(t.forName)+(isPME(t.forName)?' <span class="pmetag">PME</span>':'')+' · '+esc(t.owner||'No owner')+' · '+(od?'<span style="color:var(--red)">':'<span>')+fmt(d)+(t.dueTime?' '+esc(t.dueTime):'')+'</span>'+(t.notes?' · '+esc(t.notes.slice(0,90)):'')+'</div></div>'+
  '<div class="acts"><button data-s="1" data-r="'+t.row+'" data-n="'+esc(t.task)+'">+1d</button> <button data-s="7" data-r="'+t.row+'" data-n="'+esc(t.task)+'">+1w</button></div></div>'}
var Q='';
function has(a,b){return a&&b&&String(a).toLowerCase().indexOf(String(b).toLowerCase())>-1}
/* Entity type comes from the sheet: CLIENTS & PARTNERSHIPS TYPE column (Client / Partner, blank = Prospect);
   BRAND OUTREACH = Prospect; AGENCIES = Partner (Clipping Agency); PME tab = PME. */
function classify(d){}
/* Delete: bottom of every record panel. Two-step confirm; the app re-checks the row and logs "REMOVED · name" to TASK HISTORY. */
var DEL_LABEL={'TASKS':'task','CAMPAIGNS':'campaign','CLIENTS & PARTNERSHIPS':'entity','BRAND OUTREACH CLIENTS':'entity','PME CLIENTS':'PME client','AGENCIES':'agency','MEETINGS':'meeting','ACCOUNT MANAGERS':'account manager'};
function addDelBar(){var d=document.getElementById('dr');if(!ED||ED.isNew||!d||!d.classList.contains('on'))return;var old=document.getElementById('delbar');if(old)old.remove();
  var b=document.createElement('div');b.id='delbar';b.className='delbar';b.dataset.tab=ED.tab;b.dataset.row=ED.row;b.dataset.name=ED.key;
  b.innerHTML='<button class="b delb" data-del="1">Delete '+(DEL_LABEL[ED.tab]||'record')+'</button>';d.appendChild(b)}
document.addEventListener('click',function(e){var x=e.target.closest('[data-del]');if(!x)return;var bar=document.getElementById('delbar');if(!bar)return;var d=bar.dataset;
  if(x.dataset.del==='1'){bar.innerHTML='<span class="m">Delete <b>'+esc(d.name)+'</b> from '+esc(d.tab)+'? It is logged to TASK HISTORY.</span> <button class="b delb" data-del="2">Yes, delete</button> <button class="b" data-del="0">Cancel</button>';return}
  if(x.dataset.del==='0'){addDelBar();return}
  x.disabled=true;x.textContent='Deleting…';
  run('deleteRecord',d.tab,+d.row,d.name).then(function(){toast('Deleted '+d.name);closeDr();ED=null;return load()}).catch(function(err){toast(err.message);addDelBar()})});

/* Type controls: CLIENTS & PARTNERSHIPS writes TYPE (D; blank = Prospect) and, for partners, BUSINESS TYPE (I) as the subtype. */
function entTypeHtml(c){var lab=esc(c.kind)+(c.sub?' · '+esc(c.sub):'');
  if(c.src!=='Clients & Partnerships')return'<div style="color:var(--mute);font-size:12px">'+lab+'</div>';
  var cur=c.kind==='Client'?'Client':c.kind==='Partner'?'Partner':'';
  return'<div class="typerow"><select class="typesel" data-tab="CLIENTS & PARTNERSHIPS" data-row="'+c.row+'" data-name="'+esc(c.name)+'" data-col="D" title="Type">'+
    [['','Prospect'],['Client','Client'],['Partner','Partner']].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+
    (c.kind==='Partner'?'<input class="typesub" data-tab="CLIENTS & PARTNERSHIPS" data-row="'+c.row+'" data-name="'+esc(c.name)+'" data-col="I" list="subl" placeholder="Partner type, e.g. Talent Agency" value="'+esc(c.biz||'')+'"><datalist id="subl">'+
      ['Brand Agency','Talent Agency','Record Label','Clipping Agency Sourcer','Production House','PR Agency'].map(function(x){return'<option value="'+x+'">'}).join('')+'</datalist>':'')+'</div>'}
document.addEventListener('change',function(e){var el=e.target;if(!el.classList||!(el.classList.contains('typesel')||el.classList.contains('typesub')))return;
  var d=el.dataset;el.disabled=true;
  run('updateCell',d.tab,+d.row,d.name,d.col,el.value).then(function(){toast('Saved');return load()}).then(function(){
    if(d.tab==='CAMPAIGNS'){var i=D.campaigns.findIndex(function(x){return x.row===+d.row});if(i>-1)campDr(i)}
    else{var j=D.clients.findIndex(function(x){return x.src==='Clients & Partnerships'&&x.row===+d.row});if(j>-1)cliDr(j)}})
   .catch(function(err){toast(err.message);el.disabled=false})});

function same(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function linkedTasks(n){return D.tasks.filter(function(t){return same(t.forName,n)}).sort(sortT)}
function dl(o){return'<dl>'+Object.keys(o).filter(function(k){return o[k]}).map(function(k){return'<dt>'+k+'</dt><dd>'+esc(o[k])+'</dd>'}).join('')+'</dl>'}
function openDr(h){var d=document.getElementById('dr');d.innerHTML='<button class="x" onclick="closeDr()">×</button>'+h;d.classList.add('on')}
function closeDr(){document.getElementById('dr').classList.remove('on')}
function tasksBlock(n){var ts=linkedTasks(n);return'<h3>Open tasks ('+ts.length+')</h3>'+(ts.length?ts.map(taskHtml).join(''):'<div class="empty">None</div>')}
function trimNote(s,n){s=String(s||'');if(s.length<=n)return{a:s,b:''};var i=s.lastIndexOf(' ',n);if(i<n*.6)i=n;return{a:s.slice(0,i),b:s.slice(i)}}
function briefHtml(pairs,notes){var kv=pairs.filter(function(p){return p[0]&&p[1]}).map(function(p){return'<dt>'+p[0]+'</dt><dd>'+p[1]+'</dd>'}).join(''),n=trimNote(notes,320);
  return'<h3>Brief</h3>'+(kv?'<dl class="brief">'+kv+'</dl>':'')+(n.a?'<div class="note">'+esc(n.a)+(n.b?'<details><summary>Show more</summary>'+esc(n.b)+'</details>':'')+'</div>':'<div class="empty">No notes yet</div>')}
function addTaskBtn(name){return'<div style="margin-top:8px"><button class="b" data-new="TASKS" data-t="New task" data-for="'+esc(name)+'">+ Task</button></div>'}
/* ---------- drawers: essentials on top, links not fields, advanced collapsed ---------- */
var ESS={'CAMPAIGNS':['E','G','C','B','F','I','U','N'],
  'PME CLIENTS':['C','E','B','D','H','K','I','J','F'],
  'AGENCIES':['C','E','B','D','G','H','M','N','O'],
  'CLIENTS & PARTNERSHIPS':['C','G','B','F','I','J','N','O','Q'],
  'BRAND OUTREACH CLIENTS':['C','F','B','E','H','I','M','N','P']};
var LKEYS={'CAMPAIGNS':{master:['L','Master file'],deck:['M','Deck'],infl:['AD','Influencers'],bill:['AO','Billing']},'PME CLIENTS':{bill:['Q','Billing']},'AGENCIES':{bill:['Z','Billing']}};
var CUR=null,LKC=null;
function linkChip(tab,links,k){var d=LKEYS[tab][k],l=(links||{})[k],has=l&&l.url;
  return'<span class="lk'+(has?'':' none')+'">'+(has?'<a href="#" data-url="'+esc(l.url)+'">'+d[1]+' ↗</a>':'<span class="m">'+d[1]+'</span>')+'<button class="ed" title="'+(has?'Replace':'Add')+' link" data-lkedit="'+k+'">'+(has?'✎':'+')+'</button></span>'}
function linksRow(tab,links,keys){return'<div class="lkrow">'+keys.map(function(k){return linkChip(tab,links,k)}).join('')+'</div><div id="lkform"></div>'}
function editSplit(tab,row,ess,extra){var bE=document.getElementById('edE'),bA=document.getElementById('edA');if(bE)bE.innerHTML='<div class="empty">Loading…</div>';
  return run('getRecord',tab,row).then(function(r){var sch=r.schema,ki=sch.cols.findIndex(function(c){return c.col===sch.key});
    ED={tab:tab,row:row,key:r.values[ki],values:r.values,schema:sch};setTimeout(addDelBar,0);var idx={};sch.cols.forEach(function(c,i){idx[c.col]=i});
    var one=function(L){var i=idx[L];return i===undefined?'':fieldHtml(sch.cols[i],r.values[i],i)};
    var inEss={};ess.forEach(function(L){inEss[L]=1});var hold=extra?extra(one):{html:'',used:{}};
    if(bE)bE.innerHTML='<div class="form">'+ess.map(function(L){return hold.used&&hold.used[L]?'':one(L)}).join('')+'</div>'+hold.html;
    var items=[];sch.cols.forEach(function(c,i){if(inEss[c.col]||c.link||(tab==='CAMPAIGNS'&&c.col==='A')||(hold.used&&hold.used[c.col]))return;
      if(c.readonly&&/▸/.test(c.label))items.push({sec:1,h:'<div class="sec">'+esc(c.label.replace('▸','').replace(/[^\w\s/&#%?-]/g,'').trim())+'</div>'});else items.push({h:fieldHtml(c,r.values[i],i)})});
    var out=[];items.forEach(function(it,n){if(it.sec){var nx=items[n+1];if(!nx||nx.sec)return}out.push(it.h)});
    if(bA)bA.innerHTML='<div class="form">'+out.join('')+'</div>'})
   .catch(function(e){if(bE)bE.innerHTML='<div class="empty">'+esc(e.message)+'</div>'})}
function updatesOf(name){return(D.log||[]).filter(function(l){return same(l.client,name)&&l.type==='Update'}).slice().reverse()}

  (u.length>1?'<details class="allf"><summary>Update history ('+(u.length-1)+' earlier)</summary>'+u.slice(1).map(function(l){return'<div class="upd" style="margin-top:6px"><b>'+fmt(parseDue(l.date))+'</b> · '+esc(l.by)+'<div>'+esc(l.summary)+'</div></div>'}).join('')+'</details>':'')}

/* Drive folders: FOLDER column at the end of CAMPAIGNS and each entity tab. Open it if linked, else offer Create. */
function folderBtn(tab,c){var f=(c.links||{}).folder;
